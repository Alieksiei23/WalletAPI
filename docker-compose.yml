services:
  rabbitmq:
    image: rabbitmq:3.10.7-management
    container_name: rabbitmq
    hostname: rabbitmq
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=${RM_USER}
      - RABBITMQ_DEFAULT_PASS=${RM_PASS}
    networks:
      - dbnet
    ports:
      - 15672:15672
      - 5672:5672

  postgres:
    image: postgres:17-alpine
    container_name: psgr
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_PASSWORD=${DB_PASS}
    networks:
      - dbnet
    ports:
      - "5432:5432"


  fastapi:
    build: .
    container_name: fastapi
    depends_on:
      - rabbitmq
      - postgres
    networks:
      - dbnet
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app

  dramatiq:
    build: .
    container_name: dramatiq
    command: dramatiq src.tasks.tasks
    depends_on:
      - rabbitmq
      - postgres
    networks:
      - dbnet
    env_file:
      - .env
    volumes:
      - .:/app

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    ports:
      - "9080:9080"
    networks:
      - dbnet
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./logs/promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    privileged: true

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    networks:
      - dbnet
    volumes:
      - ./logs/loki-config.yaml:/etc/loki/local-config.yaml

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    networks:
      - dbnet
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheusdata:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - dbnet
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_PASS}
    volumes:
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - grafanadata:/var/lib/grafana

networks:
  dbnet:

volumes:
  postgres-data:
  grafanadata:
  prometheusdata:
